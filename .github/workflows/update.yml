name: Update 13 Run Pool results

on:
  schedule:
    - cron: "30 10 * * *"     # every day at 10:30 UTC (5:30am Central)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch SDQL and rebuild data.json
        run: python scripts/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "Update results $(date -u +%F)"
          git push
